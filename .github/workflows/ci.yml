name: Verify Python, C++ and WebAssembly
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python scripts/train.py
      - run: git diff --exit-code -- web/model.json docs/evaluation.json
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m pip install ziglang==0.13.0
      - run: python scripts/build_wasm.py
      - run: npm test
      - run: npm run build
      - run: cmake -S cpp -B build && cmake --build build
      - run: PYTHONPATH=python python -m agents --native ./build/libplanner.so
